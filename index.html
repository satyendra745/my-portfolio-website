<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satyendra | Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="profile-section">
            <img src="assets/images/profile.jpg" alt="Satyendra" class="profile-pic">
            <h2>Satyendra</h2>
            <div class="social-links">
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="#home"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#about"><i class="fas fa-user"></i> About</a></li>
                <li><a href="#skills"><i class="fas fa-code"></i> Skills</a></li>
                <li><a href="#experience"><i class="fas fa-briefcase"></i> Experience</a></li>
                <li><a href="#projects"><i class="fas fa-project-diagram"></i> Projects</a></li>
            </ul>
        </nav>
    </aside>

    <main class="content">
        <section id="home" class="hero">
            <h1>Satyendra</h1>
            <p>I am experienced in <span>Full Stack Development</span></p>
            <button class="btn">View Projects ↓</button>
        </section>

        <section id="skills">
            <h2>Technical Skills</h2>
            <div class="skills-grid">
                <div class="skill-category">
                    <h3>Core:</h3>
                    <p>Python, HTML, CSS, JavaScript</p>
                </div>
                <div class="skill-category">
                    <h3>Tools:</h3>
                    <p>Git, GitHub, VS Code</p>
                </div>
            </div>
        </section>

        <section id="projects">
            <h2>Projects</h2>
            <div class="project-grid">
                <div class="project-card">
                    <img src="assets/images/project1.jpg" alt="Project">
                    <div class="project-info">
                        <h3>My Portfolio Work</h3>
                        <button>View Details</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
